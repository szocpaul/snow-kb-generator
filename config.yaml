# snow-kb-generator beállítások
# A titkok (.env.example) külön, nem verziókövetettek. Ez csak strukturált beállítások.

servicenow:
  # Melyik KB-be írjunk. Ezt a ServiceNow UI-ban / API-ban lehet lekérni.
  knowledge_base_id: "a7e8a78bff0221009b20ffffffffff17"
  default_category: "General"           # KB kategória neve vagy sys_id
  story_table: "rm_story"               # instance-onként "story" vagy "rm_story"
  # Ha a Story nem ad kategóriát, ez az alapértelmezés.
  # language: "en"

pipeline:
  # DSPy prediktor alakok lépésenként (tervezett — lásd signatures.py):
  #   extract: ChainOfThought (indoklás kell a kinyeréshez)
  #   draft:   ChainOfThought
  #   format:  Predict (transzformáció, nem kell érvelés)
  default_temperature: 0.6
  max_tokens: 16000
  # Ha True, a Pi Agent auth.json-ből olvassa az API kulcsot (GLM előfizetés).
  # Ha False, a szabványos dspy.LM-et használ (lokális endpoint vagy OPENAI_API_KEY).
  use_pi_auth: false
  # Task modell: ALAP = "kimi" (Kimi K3, Kimi Code előfizetés) | DEV mód = "local" (lokális Qwen llama.cpp)
  # Dev mód ki/bekapcsolása: SNOW_KB_DEV_MODE=1 env vagy CLI --dev flag
  task_model: "kimi"
  # Lokális llama.cpp endpoint (Qwen3.8-27B, 2026-08-12-től) Tailscale serve-en keresztül
  api_base: "http://desktop-c5ikame-1.tailee6bc1.ts.net:8033/v1"

models:
  # A generáló modell (dspy.configure globálisan erre).
  main: 'openai/models\Qwen3.8-27B-UD-Q4_K_M.gguf'  # 2026-08-12: modellcsere
  # GEPA reflection modell — a Pi Agent Kimi előfizetés (Kimi K3).
  # Csak a GEPA optimalizációkor használjuk, a napi generáláshoz a fenti (lokális Qwen) modell fut.
  reflection: "openai/kimi-k3"
  reflection_temperature: 1.0
  reflection_max_tokens: 32000

# Kalibrált, típusos audience-döntés (spec 013) — ARCHIVÁLVA 2026-09-30.
# A döntésnek nincs downstream-fogyasztója: minden KB ugyanazzal az L2/L3
# template-tel készül, a helpdesk/end-user/developer osztályok nincsenek
# használva (ld. Agent.md §43). A kód és a mérőinfrastruktúra megmarad —
# újraaktiválás csak új, mérhető döntési igénnyel.
# enabled=false → a generatív (ExtractChange) audience-út marad (kapcsolható fallback, FR-004).
audience_decision:
  enabled: false
  # PINNELT döntési modellverzió — lebegő alias (jev-latest) TILOS a kalibrációhoz
  # (playbook: „modell-csere = baseline újramérés").
  model: "jev-1.13.0"
  # Confirmatory kapu (spec SC-002): ennél alacsonyabb confidence-nél
  # default "developer" + work_notes-jelzés. A T012 kalibrációs mérés hangolja.
  confidence_threshold: 0.7
  # Replay-kompatibilis JSONL döntésnapló (FR-003) — a kalibrációs mérés adatforrása.
  recording_path: "artifacts/audience_decisions.jsonl"

# Komponensnév-hitelesítés az instance ellen + production push-gate (spec 014).
# enabled=false az alapértelmezés — a gate bekapcsolása a T014 MANUÁLIS KAPU
# döntése (a spec tilalma szerint a runner nem kapcsolja be).
verification_gate:
  # 2026-09-30, T014 MANUÁLIS KAPU: az ember BEKAPCSOLTA (enabled=true, behavior=flag)
  # megfigyelési időszakra — a JSONL recording a mérési alap; strip/block csak
  # későbbi, adat-alapú döntéssel. Döntések: Agent.md (spec 014 naplóbejegyzés).
  enabled: true
  # A gate viselkedése nem-létező komponensnév esetén (KD1 default: flag):
  #   flag  = work_notes-jelzés a mért confidence-szel, a cikk kimegy
  #   strip = a gyanús nevek eltávolítása a cikkből (durvább beavatkozás)
  #   block = a push blokkolása (fail-closed — csak mérés után)
  behavior: "flag"
  # PINNELT döntési modellverzió a kalibrált (homályos esetek) réteghez —
  # lebegő alias TILOS (playbook: „modell-csere = baseline újramérés", FR-005).
  model: "jev-1.13.0"
  # Confirmatory kapu: ennél alacsonyabb confidence-nél a név „nem létezik"-nek
  # számít. 2026-10-01, spec 015 T009 MANUÁLIS KAPU: az ember JÓVÁHAGYTA a
  # 0.7 → 0.35 módosítást (aszimmetrikus költség 21→18 az 57 példás PDI-natív
  # mintán, 10:1 súlyarány megerősítve; SC-003: nincs romlás a régi mintán).
  # FELTÉTEL: a 0.35 egyetlen FP-példán nyugszik → a KÖVETKEZŐ minta-bővítésnél
  # ÚJRAMÉRENDŐ. Indoklás: Agent.md (spec 015 naplóbejegyzés).
  confidence_threshold: 0.35
  # Per-név spot-check cache (JSON) — a recording része, a replay ettől
  # byte-identikus (SC-004).
  spotcheck_cache_path: "artifacts/spotcheck_cache.json"
  # Replay-kompatibilis JSONL döntésnapló (FR-003) — a kalibrációs mérés adatforrása.
  recording_path: "artifacts/verification_decisions.jsonl"


# Kontextus-válogatás a cikkgenerálás előtt (spec 016).
# enabled=false az alapértelmezés — a bekapcsolás csak a T003/T009/T012
# MANUÁLIS KAPUk után, mérés-alapú döntéssel. Fail-open: hiba vagy alacsony
# confidence esetén minden darab változatlanul bekerül (show).
context_selection:
  enabled: false
  # PINNELT döntési modellverzió — lebegő alias TILOS a kalibrációhoz.
  model: "jev-1.13.0"
  # Policy-küszöbök a normalizált relevanciára ([0,1], '<' operátor, a
  # határérték a biztonságos irányba dől). A hide_below CSAK a T012 MANUÁLIS
  # KAPU jóváhagyása után módosulhat (a T011 ReAnchor-kalibráció exploratív).
  hide_below: 0.25
  summarize_below: 0.60
  # Fail-open küszöb: ennél alacsonyabb confidence-nél a darab show (FR-002).
  min_confidence: 0.6
  # A summarize összefoglaló a lokális Qwen-endpointon (KD3 — élesben is ez).
  summarizer_endpoint: "http://desktop-c5ikame-1.tailee6bc1.ts.net:8033/v1"
  # Replay-kompatibilis JSONL döntésnapló (FR-003).
  recording_path: "artifacts/context_selection_decisions.jsonl"

gepa:
  auto: "medium"                        # light | medium | heavy
  candidate_selection: "pareto"
  num_threads: 8
  seed: 0

story_fields:
  - short_description
  - description
  - acceptance_criteria
  - u_technical_specification
  - work_notes
  - comments
  - state
  - assigned_to
  - assignment_group

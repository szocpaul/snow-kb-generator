# snow-kb-generator beállítások
# A titkok (.env.example) külön, nem verziókövetettek. Ez csak strukturált beállítások.

servicenow:
  # Melyik KB-be írjunk. Ezt a ServiceNow UI-ban / API-ban lehet lekérni.
  knowledge_base_id: "a7e8a78bff0221009b20ffffffffff17"  # IT Knowledge Base
  default_category: "General"           # KB kategória neve vagy sys_id
  story_table: "rm_story"               # instance-onként "story" vagy "rm_story"
  # Ha a Story nem ad kategóriát, ez az alapértelmezés.
  # language: "en"

pipeline:
  # DSPy prediktor alakok lépésenként (tervezett — lásd signatures.py):
  #   extract: ChainOfThought (indoklás kell a kinyeréshez)
  #   draft:   ChainOfThought
  #   format:  Predict (transzformáció, nem kell érvelés)
  default_temperature: 0.0
  max_tokens: 8000
  # Ha True, a Pi Agent auth.json-ből olvassa az API kulcsot (GLM előfizetés).
  # Ha False, a szabványos dspy.LM-et használ (lokális endpoint vagy OPENAI_API_KEY).
  use_pi_auth: false
  # Lokális llama.cpp endpoint (Qwen3.6-35B-A3B)
  api_base: "http://100.74.99.67:8033/v1"

models:
  # A generáló modell (dspy.configure globálisan erre).
  main: "openai/Qwen3.6-35B-A3B-NSC-ACE-SABER-Q4_K_M.gguf"
  # GEPA reflection modell — erősebb modell javasolt (GLM-5.2 a Pi Agent előfizetésből).
  # Csak a GEPA optimalizációkor használjuk, a napi generáláshoz a fenti (lokális) modell fut.
  reflection: "openai/glm-5.2"
  reflection_temperature: 1.0
  reflection_max_tokens: 32000

gepa:
  auto: "medium"                        # light | medium | heavy
  candidate_selection: "pareto"
  num_threads: 8
  seed: 0

story_fields:
  - short_description
  - description
  - acceptance_criteria
  - u_technical_specification
  - work_notes
  - comments
  - state
  - assigned_to
  - assignment_group

# the snow-kb-generator settings
# The secrets (.env.example) are separate and not version controlled. This file only has structured settings.

servicenow:
  # Which KB we write into. It can be read in the ServiceNow UI / API.
  knowledge_base_id: "00000000000000000000000000000002"
  default_category: "General"           # the name or the sys_id of the KB category
  story_table: "rm_story"               # "story" or "rm_story" depending on the instance
  # If the Story does not give a category, this is the default.
  # language: "en"

pipeline:
  # The DSPy predictor shapes per step (designed — see signatures.py):
  #   extract: ChainOfThought (the extraction needs reasoning)
  #   draft:   ChainOfThought
  #   format:  Predict (a transformation, no reasoning needed)
  default_temperature: 0.6
  max_tokens: 16000
  # If True, it reads the API key from the Pi Agent auth.json (GLM subscription).
  # If False, it uses the standard dspy.LM (local endpoint or OPENAI_API_KEY).
  use_pi_auth: false
  # Task model: PROD = "kimi" (Kimi K3, Kimi Code subscription) | DEV mode = "local" (local Qwen llama.cpp)
  # Switching the dev mode on/off: the SNOW_KB_DEV_MODE=1 env variable or the CLI --dev flag
  task_model: "kimi"
  # The local llama.cpp endpoint (Qwen3.8-27B, since 2026-08-12) through the Tailscale serve
  api_base: "http://llm-server.local:8033/v1"

models:
  # The generating model (dspy.configure globally to this).
  main: 'openai/models\Qwen3.8-27B-UD-Q4_K_M.gguf'  # 2026-08-12: modellcsere
  # The GEPA reflection model — the Pi Agent Kimi subscription (Kimi K3).
  # We only use it for the GEPA optimization, the daily generation runs with the model above (the local Qwen).
  reflection: "openai/kimi-k3"
  reflection_temperature: 1.0
  reflection_max_tokens: 32000

# The calibrated, typed audience decision (spec 013) — ARCHIVED on 2026-09-30.
# The decision has no downstream consumer: every KB is made with the same L2/L3
# template, the helpdesk/end-user/developer categories are not
# used (see Agent.md §43). The code and the measurement infrastructure stay —
# a reactivation only with a new, measurable decision need.
# enabled=false → the generative (ExtractChange) audience path stays (the switchable fallback, FR-004).
audience_decision:
  enabled: false
  # The PINNED decision model version — a floating alias (jev-latest) is FORBIDDEN for the calibration
  # (playbook: "a model change = a new baseline measurement").
  model: "jev-1.13.0"
  # The confirmatory gate (spec SC-002): below this confidence
  # the default "developer" + a work_notes signal. The T012 calibration measurement tunes it.
  confidence_threshold: 0.7
  # replay compatible because of it. The replay-compatible JSONL decision log (FR-003) — the data source of the calibration measurement.
  recording_path: "artifacts/audience_decisions.jsonl"

# The component name verification against the instance + the production push gate (spec 014).
# enabled=false is the default — switching the gate on is the decision of the T014 MANUAL GATE
# (per the prohibition of the spec the runner does not switch it on).
verification_gate:
  # 2026-09-30, T014 MANUAL GATE: the human SWITCHED IT ON (enabled=true, behavior=flag)
  # for the observation period — the JSONL recording is the measurement base; strip/block only
  # with a later, data-based decision. The decisions: Agent.md (the spec 014 log entry).
  enabled: true
  # The behaviour of the gate for a non-existent component name (KD1 default: flag):
  #   flag  = a work_notes signal with the measured confidence, the article goes out
  #   strip = the suspicious names are removed from the article (a rougher intervention)
  #   block = blocking the push (fail-closed — only after a measurement)
  behavior: "flag"
  # The PINNED decision model version for the calibrated (ambiguous cases) layer —
  # a floating alias is FORBIDDEN (playbook: "a model change = a new baseline measurement", FR-005).
  model: "jev-1.13.0"
  # The confirmatory gate: below this confidence the name counts as "does not exist"
  # counts. 2026-10-01, spec 015 T009 MANUAL GATE: the human APPROVED the
  # 0.7 → 0.35 change (the asymmetric cost 21→18 on the 57-example PDI-native
  # sample, the 10:1 weight ratio confirmed; SC-003: no degradation on the old sample).
  # CONDITION: the 0.35 rests on a single FP case → at the NEXT sample expansion it
  # has to be RE-MEASURED. The justification: Agent.md (the spec 015 log entry).
  confidence_threshold: 0.35
  # The per name spot-check cache (JSON) — it is part of the recording, the replay is
  # byte-identikus (SC-004).
  spotcheck_cache_path: "artifacts/spotcheck_cache.json"
  # replay compatible because of it. The replay-compatible JSONL decision log (FR-003) — the data source of the calibration measurement.
  recording_path: "artifacts/verification_decisions.jsonl"

gepa:
  auto: "medium"                        # light | medium | heavy
  candidate_selection: "pareto"
  num_threads: 8
  seed: 0

story_fields:
  - short_description
  - description
  - acceptance_criteria
  - u_technical_specification
  - work_notes
  - comments
  - state
  - assigned_to
  - assignment_group
